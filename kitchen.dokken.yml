driver:
  name: dokken
  privileged: true
  # CI runners start fresh; later suites can use the same downloaded base images.
  # Containers and suite state are still destroyed after every test.
  pull_chef_image: <%= ENV['KITCHEN_REUSE_IMAGES'] != 'true' %>
  pull_platform_image: <%= ENV['KITCHEN_REUSE_IMAGES'] != 'true' %>
  chef_image: "<%= ENV.fetch('KITCHEN_PRODUCT_NAME', 'cinc') == 'cinc' ? 'cincproject/cinc' : 'chef/chef' %>"
  chef_version: "<%= ENV['CHEF_VERSION'] || (ENV.fetch('KITCHEN_PRODUCT_NAME', 'cinc') == 'cinc' ? 'latest' : 'current') %>"

transport: { name: dokken }
provisioner:
  name: dokken
  chef_binary: "<%= ENV.fetch('KITCHEN_PRODUCT_NAME', 'cinc') == 'cinc' ? '/opt/cinc/bin/cinc-client' : '/opt/chef/bin/chef-client' %>"
  product_name: "<%= ENV['KITCHEN_PRODUCT_NAME'] || 'cinc' %>"

platforms:
  - name: almalinux-8
    driver:
      image: dokken/almalinux-8
      pid_one_command: /usr/lib/systemd/systemd

  - name: almalinux-9
    driver:
      image: dokken/almalinux-9
      pid_one_command: /usr/lib/systemd/systemd

  - name: almalinux-10
