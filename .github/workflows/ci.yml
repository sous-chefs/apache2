---
name: ci

"on":
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      integration: ${{ steps.changes.outputs.integration }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Test CI planning
        run: python3 -m unittest discover -s .github/ci -p 'test_*.py'
      - name: Classify changes
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 .github/ci/integration.py changes

  lint-unit:
    uses: sous-chefs/.github/.github/workflows/lint-unit.yml@codex/cache-cinc-workstation
    permissions:
      actions: write
      checks: write
      pull-requests: write
      statuses: write
      issues: write
    secrets: inherit

  prepare:
    needs: [changes, lint-unit]
    if: needs.changes.outputs.integration == 'true'
    runs-on: ubuntu-24.04
    outputs:
      grouped: ${{ steps.plan.outputs.grouped }}
      individual: ${{ steps.plan.outputs.individual }}
      dependencies: ${{ steps.plan.outputs.dependencies }}
      dependency-key: ${{ steps.plan.outputs.dependency_key }}
    env:
      KITCHEN_LOCAL_YAML: kitchen.dokken.yml
      KITCHEN_PRODUCT_NAME: cinc
    steps:
      - uses: actions/checkout@v7
      - name: Restore Cinc Workstation
        uses: sous-chefs/.github/.github/actions/install-workstation@codex/cache-cinc-workstation
      - name: Plan identical suite coverage and dependency revisions
        id: plan
        run: python3 .github/ci/integration.py prepare

  integration:
    name: integration (${{ matrix.os }})
    needs: [changes, prepare]
    if: needs.changes.outputs.integration == 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJSON(needs.prepare.outputs.grouped) }}
    env:
      CHEF_LICENSE: accept-no-persist
      CHEF_VERSION: latest
      KITCHEN_LOCAL_YAML: kitchen.dokken.yml
      KITCHEN_PRODUCT_NAME: cinc
      MULTIPLE_CONVERGE: '2'
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-integration
        with:
          dependencies: ${{ needs.prepare.outputs.dependencies }}
          dependency-key: ${{ needs.prepare.outputs.dependency-key }}
      - name: Dokken suites with fresh containers
        env:
          KITCHEN_INSTANCES: ${{ toJSON(matrix.instances) }}
        run: python3 .github/ci/integration.py run

  # Temporary comparison: same commit, dependency revisions and eight-job limit.
  integration-baseline:
    name: baseline (${{ matrix.instances[0] }})
    needs: [changes, prepare]
    if: needs.changes.outputs.integration == 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJSON(needs.prepare.outputs.individual) }}
    env:
      CHEF_LICENSE: accept-no-persist
      CHEF_VERSION: latest
      KITCHEN_LOCAL_YAML: kitchen.dokken.yml
      KITCHEN_PRODUCT_NAME: cinc
      MULTIPLE_CONVERGE: '2'
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-integration
        with:
          dependencies: ${{ needs.prepare.outputs.dependencies }}
          dependency-key: ${{ needs.prepare.outputs.dependency-key }}
      - name: Dokken single suite
        env:
          KITCHEN_INSTANCES: ${{ toJSON(matrix.instances) }}
        run: python3 .github/ci/integration.py run

  final:
    runs-on: ubuntu-slim
    needs: [changes, lint-unit, prepare, integration, integration-baseline]
    if: always()
    steps:
      - name: Require successful checks or an intentional documentation skip
        env:
          CHANGES: ${{ needs.changes.result }}
          LINT: ${{ needs.lint-unit.result }}
          REQUIRED: ${{ needs.changes.outputs.integration }}
          PREPARE: ${{ needs.prepare.result }}
          INTEGRATION: ${{ needs.integration.result }}
          BASELINE: ${{ needs.integration-baseline.result }}
        run: |
          test "$CHANGES" = success
          test "$LINT" = success
          if [ "$REQUIRED" = true ]; then
            test "$PREPARE" = success
            test "$INTEGRATION" = success
            test "$BASELINE" = success
          else
            test "$REQUIRED" = false
            echo 'Integration skipped: documentation-only changes.'
          fi
