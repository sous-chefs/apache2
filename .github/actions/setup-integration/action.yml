---
name: Prepare integration dependencies
description: Restore Workstation and cache downloads for an exact Policyfile dependency snapshot.
inputs:
  dependencies:
    description: Resolved Git dependency revisions.
    required: true
  dependency-key:
    description: Hash of the Policyfile and resolved Git dependencies.
    required: true
runs:
  using: composite
  steps:
    - name: Restore Cinc Workstation
      id: workstation
      uses: sous-chefs/.github/.github/actions/install-workstation@codex/cache-cinc-workstation
    - name: Configure dependency cache and pin Git revisions
      shell: bash
      env:
        DEPENDENCIES: ${{ inputs.dependencies }}
      run: |
        echo "CHEF_WORKSTATION_HOME=$RUNNER_TEMP/chef-workstation" >> "$GITHUB_ENV"
        git config --global maintenance.auto false
        git config --global gc.auto 0
        python3 .github/ci/integration.py pin
    - name: Restore cookbook downloads
      id: cache
      uses: actions/cache/restore@v5
      with:
        path: ${{ runner.temp }}/chef-workstation/cache
        key: policyfile-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.workstation.outputs.version }}-${{ inputs.dependency-key }}
    - name: Resolve cookbooks for this checkout
      shell: bash
      run: /opt/cinc-workstation/bin/chef-cli install Policyfile.rb
    - name: Save cookbook downloads
      if: steps.cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v5
      with:
        path: ${{ runner.temp }}/chef-workstation/cache
        key: policyfile-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.workstation.outputs.version }}-${{ inputs.dependency-key }}
